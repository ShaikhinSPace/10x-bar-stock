<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1524; --surface:#152238; --surface-2:#1E3050; --line:#2A3F60;
    --txt:#EAF1FC; --txt-2:#A6B9D6; --txt-3:#647A9C;
    --blue:#3E8EF7; --blue-ink:#04244f;
    --green:#3FC58A; --amber:#EBB44C; --red:#EC6E6E;
    --store:#3E8EF7; --patio:#27B7C6; --back:#8E86F2;
    --sans:'Inter',system-ui,sans-serif; --disp:'Space Grotesk',system-ui,sans-serif; --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.4;padding-bottom:104px;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.01em}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
  .ptitle{font-family:var(--disp);font-weight:600;font-size:20px;margin:2px 2px 14px;display:flex;align-items:center;gap:10px}
  .ptitle .sub{font-size:12px;color:var(--txt-3);font-weight:500;font-family:var(--sans);letter-spacing:.02em}

  /* shell */
  .app{display:block}
  .sidebar{display:none}
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 84%,transparent);padding:14px 14px 8px}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .mark{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.02em}
  .brand .mark b{color:var(--blue)}
  .brand .sub{font-size:11px;color:var(--txt-3);letter-spacing:.09em;text-transform:uppercase}

  .mnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,21,36,.93);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 0 max(10px,env(safe-area-inset-bottom))}
  .mnav-in{max-width:560px;margin:0 auto;display:flex;padding:0 8px}
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--txt-3);font-size:10.5px;font-weight:600;padding:4px 0}
  .mnav button svg{width:22px;height:22px}
  .mnav button.on{color:var(--blue)}

  /* location switcher + stats */
  .locs{display:flex;gap:8px;margin:0 0 12px}
  .loc{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.15s}
  .loc .ic{width:20px;height:20px;color:var(--txt-3)}
  .loc .nm{font-size:13px;font-weight:600;color:var(--txt-2)}
  .loc .ct{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--txt-3);line-height:1}
  .loc.on[data-loc="store"]{border-color:var(--store);background:rgba(62,142,247,.12)}
  .loc.on[data-loc="patio"]{border-color:var(--patio);background:rgba(39,183,198,.12)}
  .loc.on[data-loc="back"]{border-color:var(--back);background:rgba(142,134,242,.12)}
  .loc.on .nm,.loc.on .ic,.loc.on .ct{color:var(--txt)}

  .stats{display:flex;gap:8px;margin:0 0 12px}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
  .stat .n{font-family:var(--disp);font-weight:600;font-size:22px;line-height:1}
  .stat .l{font-size:10.5px;color:var(--txt-3);margin-top:5px;letter-spacing:.03em;text-transform:uppercase}
  .stat.warn .n{color:var(--amber)} .stat.accent .n{color:var(--blue)} .stat.bad .n{color:var(--red)}

  .search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .search svg{flex:none;opacity:.55}
  .search input{border:none;background:none;color:var(--txt);font-size:16px;width:100%;outline:none}
  .search input::placeholder{color:var(--txt-3)}
  .search .clr{color:var(--txt-3);font-size:20px;padding:0 2px;display:none}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--txt-2);font-size:13.5px;font-weight:500;white-space:nowrap}
  .chip.on{background:var(--txt);color:#10203a;border-color:var(--txt)}
  .chip.warn.on{background:var(--amber);border-color:var(--amber);color:#3a2a06}

  .list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;transition:.12s}
  .row:active{transform:scale(.99);background:var(--surface-2)}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .dist{font-size:11.5px;color:var(--txt-3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
  .row .dist b{font-weight:600;font-variant-numeric:tabular-nums}
  .row .dist .d-store b{color:var(--store)} .row .dist .d-patio b{color:var(--patio)} .row .dist .d-back b{color:var(--back)}
  .row .qty{font-family:var(--disp);font-weight:600;font-size:25px;line-height:1;min-width:42px;text-align:right}
  .row .qty small{font-size:10px;color:var(--txt-3);display:block;font-family:var(--sans);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .row.zero .qty{color:var(--red)} .row.lowstk .qty{color:var(--amber)}
  .pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.03em}
  .pill.out{background:rgba(236,110,110,.16);color:var(--red)}
  .pill.low{background:rgba(235,180,76,.16);color:var(--amber)}
  .empty{text-align:center;color:var(--txt-3);padding:44px 20px;font-size:14.5px;line-height:1.6}

  /* cards / dashboard */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .kpi .n{font-family:var(--disp);font-weight:600;font-size:28px;line-height:1}
  .kpi .l{font-size:12px;color:var(--txt-3);margin-top:6px}
  .kpi.accent .n{color:var(--blue)} .kpi.bars .n{color:var(--patio)} .kpi.warn .n{color:var(--amber)} .kpi.mv .n{color:var(--green)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:14px}
  .card .ch{display:flex;align-items:center;gap:9px;margin-bottom:13px}
  .card .ch h3{font-size:15px}
  .card .ch .badge{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--txt-2)}
  .card .ch .badge.red{background:rgba(236,110,110,.16);color:var(--red)}
  .dgrid{display:block}

  /* horizontal bars (category) */
  .hbar{display:flex;align-items:center;gap:11px;padding:6px 0}
  .hbar .k{font-size:13px;width:78px;flex:none;color:var(--txt-2)}
  .hbar .track{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
  .hbar .fill{height:100%;border-radius:4px;background:var(--blue)}
  .hbar .v{font-family:var(--disp);font-weight:600;font-size:14px;width:36px;text-align:right;font-variant-numeric:tabular-nums}

  /* columns (7-day) */
  .cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .col .stack{width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:118px}
  .col .seg{width:100%;border-radius:3px;min-height:2px}
  .col .seg.p{background:var(--patio)} .col .seg.b{background:var(--back)}
  .col .dot{width:5px;height:5px;border-radius:50%;background:var(--line)}
  .col .cl{font-size:11px;color:var(--txt-3)}
  .col .cv{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--txt-2);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--txt-3)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

  /* per-bar */
  .barcard .h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .barcard .h .bd{width:11px;height:11px;border-radius:50%}
  .barcard .h .bn{font-family:var(--disp);font-weight:600;font-size:16px}
  .barcard .h .bt{margin-left:auto;font-family:var(--disp);font-weight:600;font-size:20px}
  .barcard .h .bt small{font-size:10px;color:var(--txt-3);font-family:var(--sans);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-left:4px}
  .onhand{font-size:12px;color:var(--txt-3);margin-bottom:10px}
  .onhand b{color:var(--txt-2);font-weight:600}
  .brk{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
  .brk .bnm{font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brk .bar-track{width:78px;height:6px;border-radius:3px;background:var(--surface-2);flex:none;overflow:hidden}
  .brk .bar-fill{height:100%;border-radius:3px}
  .brk .bq{font-family:var(--disp);font-weight:600;font-size:14px;width:26px;text-align:right;font-variant-numeric:tabular-nums}
  .alert{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .alert:first-of-type{border-top:none}
  .alert .an{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .alert .ac{font-size:11px;color:var(--txt-3);margin-top:2px}
  .alert .astat{font-family:var(--disp);font-weight:600;font-size:15px}
  .alert .astat small{font-size:11px;color:var(--txt-3);font-family:var(--sans);font-weight:500;margin-left:5px}
  .alert.out .astat{color:var(--red)} .alert.low .astat{color:var(--amber)}
  .alert .go{color:var(--blue);font-size:12px;font-weight:600;flex:none}

  /* activity */
  .toolbar{display:flex;gap:8px;margin:0 0 6px;flex-wrap:wrap}
  .tbtn{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:13.5px;font-weight:600;color:var(--txt-2);display:flex;align-items:center;justify-content:center;gap:7px}
  .tbtn:active{background:var(--surface-2)}
  .day{font-size:11.5px;color:var(--txt-3);letter-spacing:.05em;text-transform:uppercase;margin:16px 2px 8px;font-weight:600}
  .ev{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px}
  .ev .ic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:15px}
  .ev.give .ic{background:rgba(62,142,247,.15);color:var(--blue)}
  .ev.receive .ic{background:rgba(63,197,138,.15);color:var(--green)}
  .ev.count .ic{background:rgba(235,180,76,.15);color:var(--amber)}
  .ev .m{flex:1;min-width:0}
  .ev .m .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .m .s{font-size:12px;color:var(--txt-3);margin-top:2px}
  .ev .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none}
  .tag.patio{background:rgba(39,183,198,.16);color:var(--patio)}
  .tag.back{background:rgba(142,134,242,.16);color:var(--back)}
  .tag.store{background:rgba(62,142,247,.16);color:var(--store)}
  .ev .time{font-size:11px;color:var(--txt-3);flex:none;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}

  /* manage */
  .addcard .frm{display:flex;flex-direction:column;gap:10px}
  .fld label{font-size:11.5px;font-weight:600;color:var(--txt-3);letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:6px}
  .fld input,.fld select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--txt);font-size:15px;outline:none}
  .fld input:focus,.fld select:focus{border-color:var(--blue)}
  .frow{display:flex;gap:10px}.frow .fld{flex:1}
  .btn{background:var(--blue);color:var(--blue-ink);border-radius:11px;padding:12px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{opacity:.9}
  .btn.ghost{background:var(--surface-2);color:var(--txt-2);border:1px solid var(--line)}
  .mrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
  .mrow .mn{flex:1;min-width:0}
  .mrow .mn .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .mn .s{font-size:11.5px;color:var(--txt-3);margin-top:2px}
  .mrow .rl{display:flex;align-items:center;gap:6px;flex:none}
  .mrow .rl label{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.03em}
  .mrow .rl input{width:56px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px;color:var(--txt);text-align:center;font-family:var(--disp);font-weight:600;font-size:14px;outline:none}
  .mrow .rl input:focus{border-color:var(--amber)}
  .mrow .del{width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}

  /* sheet / modal */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.9,.3,1);padding:8px 0 max(18px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .sheet.show{transform:translateY(0)}
  .sheet-in{max-width:560px;margin:0 auto;padding:0 18px}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
  .sheet .sname{font-family:var(--disp);font-weight:600;font-size:21px}
  .sheet .scat{font-size:12px;color:var(--txt-3);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
  .mini{display:flex;gap:8px;margin:14px 0 18px}
  .mini .c{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px;text-align:center}
  .mini .c .v{font-family:var(--disp);font-weight:600;font-size:19px;line-height:1}
  .mini .c .k{font-size:10.5px;color:var(--txt-3);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
  .mini .c.store .v{color:var(--store)} .mini .c.patio .v{color:var(--patio)} .mini .c.back .v{color:var(--back)}
  .actseg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
  .actseg button{flex:1;padding:9px 0;border-radius:8px;font-weight:600;font-size:14px;color:var(--txt-2)}
  .actseg button.on{background:var(--blue);color:var(--blue-ink)}
  .lbl{font-size:11.5px;font-weight:600;color:var(--txt-3);letter-spacing:.06em;text-transform:uppercase;margin:0 0 9px}
  .pickrow{display:flex;gap:10px;margin-bottom:16px}
  .pick{flex:1;padding:13px;border-radius:12px;background:var(--surface-2);border:2px solid transparent;font-family:var(--disp);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--txt-2)}
  .pick .bd{width:11px;height:11px;border-radius:50%}
  .pick.sel[data-t="patio"]{border-color:var(--patio);background:rgba(39,183,198,.13);color:var(--patio)}
  .pick.sel[data-t="back"]{border-color:var(--back);background:rgba(142,134,242,.13);color:var(--back)}
  .pick.sel[data-t="store"]{border-color:var(--store);background:rgba(62,142,247,.13);color:var(--store)}
  .qsel{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}
  .step{width:54px;height:54px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:27px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--txt)}
  .step:active{background:var(--line)}
  .qnum{font-family:var(--disp);font-weight:700;font-size:42px;min-width:90px;text-align:center;font-variant-numeric:tabular-nums;background:none;border:none;color:var(--txt);outline:none;width:110px}
  .presets{display:flex;gap:7px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
  .preset{padding:7px 15px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--txt-2)}
  .preset.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
  .cnote{font-size:12.5px;color:var(--txt-3);text-align:center;margin:-6px 0 16px}
  .commit{width:100%;padding:16px;border-radius:14px;font-family:var(--disp);font-weight:600;font-size:17px;background:var(--blue);color:var(--blue-ink)}
  .commit.green{background:var(--green);color:#053521} .commit.amber{background:var(--amber);color:#3a2a06}
  .commit:disabled{opacity:.4}

  .toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(20px);z-index:60;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 10px 40px rgba(0,0,0,.55);max-width:calc(100% - 28px)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast .tx{font-size:14px;font-weight:500}
  .toast .undo{color:var(--blue);font-weight:700;font-size:14px;flex:none}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ============ DESKTOP ============ */
  @media(min-width:900px){
    body{padding-bottom:0}
    .app{display:flex;min-height:100vh}
    .topbar{display:none}
    .mnav{display:none}
    .sidebar{display:flex;flex-direction:column;width:238px;flex:none;position:sticky;top:0;height:100vh;
      border-right:1px solid var(--line);background:var(--surface);padding:20px 14px}
    .sidebar .brand{padding:4px 8px 22px}
    .sidebar .snav{display:flex;flex-direction:column;gap:4px}
    .sidebar .snav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--txt-2);font-size:14.5px;font-weight:600;text-align:left;width:100%}
    .sidebar .snav button svg{width:20px;height:20px;flex:none}
    .sidebar .snav button:hover{background:var(--surface-2)}
    .sidebar .snav button.on{background:rgba(62,142,247,.14);color:var(--blue)}
    .sidebar .foot{margin-top:auto;font-size:11px;color:var(--txt-3);padding:8px}
    .content{flex:1;min-width:0}
    .wrap{max-width:1120px;padding:26px 30px 40px}
    .ptitle{font-size:26px;margin-bottom:20px}
    .list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .kpis{grid-template-columns:repeat(4,1fr);gap:12px}
    .kpi .n{font-size:32px}
    .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
    .dgrid.trio{grid-template-columns:1fr 1fr}
    .locs{max-width:640px}.stats{max-width:640px}
    .search{max-width:640px}
    .mrow{max-width:none}
    .sheet{left:auto;right:auto;top:0;bottom:0;width:100%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:0;transform:none;padding:0;pointer-events:none;overflow:visible}
    .sheet.show{transform:none}
    .sheet .grab{display:none}

const mem={};
async function sget(k){try{if(window.storage){const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}const s=localStorage.getItem(k);if(s!=null)return JSON.parse(s);}catch(e){}return k in mem?mem[k]:null;}
async function sset(k,v){mem[k]=v;try{if(window.storage){await window.storage.set(k,JSON.stringify(v));}else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

async function boot(){
  buildNavs();
  let si=await sget("inv2");
  if(!Array.isArray(si)||!si.length){const old=await sget("inv");if(Array.isArray(old)&&old.length)si=old.map(o=>({name:o.name,cat:o.cat,store:o.stock||0,patio:0,back:0}));}
  inv = Array.isArray(si)&&si.length
      ? si.map(x=>({name:x.name,cat:x.cat,store:+x.store||0,patio:+x.patio||0,back:+x.back||0,rl:(x.rl==null?defRL(x.cat):+x.rl)}))

function normMove(m){if(m.type)return m;if(m.dir==="out")return {id:m.id,ts:m.ts,type:"give",item:m.item,cat:m.cat,qty:m.qty,to:(m.bar==="Patio Bar"?"patio":"back")};return {id:m.id,ts:m.ts,type:"receive",item:m.item,cat:m.cat,qty:m.qty};}

const byName=n=>inv.find(i=>i.name===n);

const htmlesc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// esc: goes inside onclick="fn('…')" — JS-escape first, then HTML-escape the attribute
const esc=s=>htmlesc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));

const rlOf=i=>i.rl==null?defRL(i.cat):i.rl;
function dayKey(ts){const d=new Date(ts),n=new Date(),y=new Date(n-864e5);if(d.toDateString()===n.toDateString())return "Today";if(d.toDateString()===y.toDateString())return "Yesterday";return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
const timeStr=ts=>new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const sumLoc=k=>fmt(inv.reduce((a,i)=>a+Math.max(0,i[k]),0));

function setTab(t){tab=t;if(t!=="stock")lowOnly=false;render();window.scrollTo(0,0);}
function render(){

  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="dashboard")renderDashboard();
  else if(tab==="stock")renderStock();

}

/* ================= DASHBOARD ================= */
function last7(){const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);a.push(d);}return a;}
function renderDashboard(){
  const storeTot=sumLoc("store"), barsTot=fmt(sumLoc("patio")+sumLoc("back"));
  const reorder=inv.filter(i=>i.store<=rlOf(i)).sort((a,b)=>(a.store-rlOf(a))-(b.store-rlOf(b)));
  const since=Date.now()-7*864e5;
  const give7=moves.filter(m=>m.type==="give"&&m.ts>=since).reduce((a,m)=>a+m.qty,0);

  let h=`<div class="ptitle">Dashboard <span class="sub">overview & alerts</span></div>`;
  h+=`<div class="kpis">
      <div class="kpi accent"><div class="n">${storeTot}</div><div class="l">Bottles in store</div></div>
      <div class="kpi bars"><div class="n">${barsTot}</div><div class="l">On the bars</div></div>
      <div class="kpi warn"><div class="n">${reorder.length}</div><div class="l">Need reorder</div></div>
      <div class="kpi mv"><div class="n">${give7}</div><div class="l">Given out · 7 days</div></div></div>`;

  // reorder alerts
  h+=`<div class="card"><div class="ch"><h3>Reorder alerts</h3><span class="badge ${reorder.length?'red':''}">${reorder.length} item${reorder.length===1?'':'s'}</span></div>`;
  if(!reorder.length) h+=`<div class="empty" style="padding:18px">Everything's above its reorder point. Nice.</div>`;
  else reorder.slice(0,10).forEach(i=>{const out=i.store<=0;
    h+=`<button class="alert ${out?'out':'low'}" onclick="openSheet('${esc(i.name)}')" style="width:100%;text-align:left">
        <div style="flex:1;min-width:0"><div class="an">${htmlesc(i.name)}</div><div class="ac">${cap(i.cat)} · reorder at ${fmt(rlOf(i))}</div></div>
        <div class="astat">${fmt(i.store)}<small>in store</small></div><span class="go">Order ›</span></button>`;});
  if(reorder.length>10)h+=`<div class="ac" style="padding-top:8px;text-align:center">+${reorder.length-10} more</div>`;
  h+=`</div>`;

  // charts row
  h+=`<div class="dgrid">`;
  h+=catCard();
  h+=trendCard();
  h+=`</div>`;

  // per-bar + top movers
  h+=`<div class="dgrid trio">`;
  h+=barCard("patio")+barCard("back")+topMoversCard();
  h+=`</div>`;

  document.getElementById("main").innerHTML=h;
}
function catCard(){
  const data=CAT_ORDER.map(c=>({c,v:inv.filter(i=>i.cat===c).reduce((a,i)=>a+Math.max(0,i.store),0)})).filter(d=>d.v>0).sort((a,b)=>b.v-a.v);
  const max=Math.max(1,...data.map(d=>d.v));
  let h=`<div class="card"><div class="ch"><h3>Store by category</h3></div>`;
  data.forEach(d=>{h+=`<div class="hbar"><span class="k">${cap(d.c)}</span><span class="track"><span class="fill" style="width:${Math.max(3,d.v/max*100)}%"></span></span><span class="v">${d.v}</span></div>`;});
  return h+`</div>`;
}
function trendCard(){
  const days=last7();
  const per=days.map(d=>({d,p:0,b:0}));
  moves.filter(m=>m.type==="give").forEach(m=>{const md=new Date(m.ts);md.setHours(0,0,0,0);const idx=per.findIndex(x=>x.d.getTime()===md.getTime());if(idx>=0){if(m.to==="patio")per[idx].p+=m.qty;else per[idx].b+=m.qty;}});
  const max=Math.max(1,...per.map(x=>x.p+x.b));
  let h=`<div class="card"><div class="ch"><h3>Given out · last 7 days</h3></div><div class="cols">`;
  per.forEach(x=>{const tot=x.p+x.b;const ph=x.p/max*118,bh=x.b/max*118;
    h+=`<div class="col"><span class="cv">${tot||''}</span><div class="stack">`;
    if(tot>0){ if(x.b>0)h+=`<span class="seg b" style="height:${bh}px"></span>`; if(x.p>0)h+=`<span class="seg p" style="height:${ph}px"></span>`; }
    else h+=`<span class="dot"></span>`;
    h+=`</div><span class="cl">${x.d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)}</span></div>`;});
  h+=`</div><div class="legend"><span><i style="background:var(--patio)"></i>Patio</span><span><i style="background:var(--back)"></i>Back</span></div></div>`;
  return h;
}
function barCard(bar){
  const since=Date.now()-7*864e5;
  const evs=moves.filter(m=>m.type==="give"&&m.to===bar&&m.ts>=since);
  const total=evs.reduce((a,m)=>a+m.qty,0);
  const onhand=sumLoc(bar);
  const per={};evs.forEach(m=>per[m.item]=(per[m.item]||0)+m.qty);
  const top=Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max=top.length?top[0][1]:1;
  let h=`<div class="card barcard"><div class="h"><span class="bd" style="background:${LOCCOLOR[bar]}"></span><span class="bn">${LOC[bar]}</span><span class="bt">${total}<small>pulled 7d</small></span></div><div class="onhand"><b>${onhand}</b> on hand now</div>`;
  if(!top.length)h+=`<div class="onhand" style="margin:0">Nothing pulled this week.</div>`;
  top.forEach(([nm,qy])=>h+=`<div class="brk"><span class="bnm">${htmlesc(nm)}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.max(8,qy/max*100)}%;background:${LOCCOLOR[bar]}"></span></span><span class="bq">${qy}</span></div>`);
  return h+`</div>`;
}
function topMoversCard(){
  const since=Date.now()-7*864e5;
  const per={};moves.filter(m=>m.type==="give"&&m.ts>=since).forEach(m=>per[m.item]=(per[m.item]||0)+m.qty);
  const top=Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max=top.length?top[0][1]:1;
  let h=`<div class="card"><div class="ch"><h3>Top movers · 7d</h3></div>`;
  if(!top.length)h+=`<div class="empty" style="padding:18px">No give-outs yet this week.</div>`;
  top.forEach(([nm,qy])=>h+=`<div class="brk" style="border-top-color:var(--line)"><span class="bnm">${htmlesc(nm)}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.max(8,qy/max*100)}%;background:var(--blue)"></span></span><span class="bq">${qy}</span></div>`);
  return h+`</div>`;
}

/* ================= STOCK ================= */
function renderStock(){
  const tot=k=>sumLoc(k);
  let h=`<div class="ptitle">Stock <span class="sub">tap a bottle to log a move</span></div>`;
  h+=`<div class="locs">`+Object.keys(LOC).map(k=>`<button class="loc ${loc===k?'on':''}" data-loc="${k}" onclick="setLoc('${k}')">${LOCIC[k]}<span class="nm">${k==='store'?'Store':LOC[k].replace(' Bar','')}</span><span class="ct">${tot(k)}</span></button>`).join("")+`</div>`;
  h+=`<div class="stats" id="stats"></div>`;
  h+=`<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg><input id="q" placeholder="Search a bottle…" value="${htmlesc(q)}" oninput="onSearch(this.value)" autocomplete="off"><button class="clr" id="clr" onclick="onSearch('')" style="display:${q?'block':'none'}">×</button></div>`;
  const cats=["ALL",...CAT_ORDER.filter(c=>inv.some(i=>i.cat===c))];
  h+=`<div class="chips">`;
  h+=`<button class="chip warn ${lowOnly?'on':''}" onclick="toggleLow()">${loc==='store'?'Low / out':'Stocked here'}</button>`;
  cats.forEach(c=>h+=`<button class="chip ${!lowOnly&&cat===c?'on':''}" onclick="setCat('${c}')">${c==='ALL'?'All':cap(c)}</button>`);
  h+=`</div><div class="list" id="list"></div>`;
  document.getElementById("main").innerHTML=h;
  renderStats(); renderList();
}
function renderStats(){
  const el=document.getElementById("stats"); if(!el)return;
  if(loc==="store"){const bottles=sumLoc("store");const low=inv.filter(i=>i.store<=rlOf(i)).length;const today=moves.filter(m=>m.type==="give"&&isToday(m.ts)).reduce((a,m)=>a+m.qty,0);
    el.innerHTML=`<div class="stat accent"><div class="n">${bottles}</div><div class="l">In store</div></div><div class="stat warn"><div class="n">${low}</div><div class="l">Low / out</div></div><div class="stat"><div class="n">${today}</div><div class="l">Given today</div></div>`;
  }else{const onhand=sumLoc(loc);const stocked=inv.filter(i=>i[loc]>0).length;const since=Date.now()-7*864e5;const pulled=moves.filter(m=>m.type==="give"&&m.to===loc&&m.ts>=since).reduce((a,m)=>a+m.qty,0);
    el.innerHTML=`<div class="stat accent"><div class="n">${onhand}</div><div class="l">At this bar</div></div><div class="stat"><div class="n">${stocked}</div><div class="l">Items stocked</div></div><div class="stat"><div class="n">${pulled}</div><div class="l">Pulled 7d</div></div>`;}
}
function filteredItems(){
  let items=inv.slice().sort((a,b)=>catRank(a.cat)-catRank(b.cat)||a.name.localeCompare(b.name));
  if(lowOnly){items=loc==="store"?items.filter(i=>i.store<=rlOf(i)):items.filter(i=>i[loc]>0);}
  else if(cat!=="ALL")items=items.filter(i=>i.cat===cat);
  if(q.trim())items=items.filter(i=>i.name.toLowerCase().includes(q.trim().toLowerCase()));
  return items;
}
function renderList(){
  const list=document.getElementById("list"); if(!list)return;
  const items=filteredItems(); let h='';
  if(!items.length)h=`<div class="empty">No bottles match.</div>`;
  items.forEach(i=>{const v=i[loc];const rl=rlOf(i);const zero=v<=0;const low=loc==="store"&&!zero&&v<=rl;
    const pill=loc==="store"?(zero?`<span class="pill out">OUT</span>`:low?`<span class="pill low">LOW</span>`:``):``;
    h+=`<button class="row ${zero&&loc==='store'?'zero':''} ${low?'lowstk':''}" onclick="openSheet('${esc(i.name)}')"><div class="info"><div class="nm">${htmlesc(i.name)}</div><div class="dist"><span class="d-store">Store <b>${fmt(i.store)}</b></span><span class="d-patio">Patio <b>${fmt(i.patio)}</b></span><span class="d-back">Back <b>${fmt(i.back)}</b></span></div></div>${pill}<div class="qty">${fmt(v)}<small>${loc==='store'?'in store':'at bar'}</small></div></button>`;});
  list.innerHTML=h;
}
function onSearch(v){q=v;const c=document.getElementById("clr");if(c)c.style.display=v?'block':'none';renderList();}
function setLoc(k){loc=k;lowOnly=false;render();}
function setCat(c){cat=c;lowOnly=false;render();}
function toggleLow(){lowOnly=!lowOnly;render();}

/* ================= SHEET ================= */
function curQ(){return sh.act==="give"?"q-give":sh.act==="receive"?"q-receive":"q-count";}
function openSheet(name){
  const it=byName(name); if(!it)return;
  sh={name,act:loc==="store"?"give":(loc==="patio"||loc==="back")?"count":"give",give:{bar:(loc==="patio"||loc==="back")?loc:null,qty:1},receive:{qty:1},count:{loc:loc==="store"?"store":loc,val:it[loc]||it.store}};
  document.getElementById("sh-name").textContent=name;
  document.getElementById("sh-cat").textContent=cap(it.cat);
  refreshMini();
  const beer=it.cat==="BEER";const pre=beer?[1,6,12,24]:[1,2,3,6];
  document.getElementById("pre-give").innerHTML=pre.map(p=>`<button class="preset ${p===1?'on':''}" onclick="setQty(${p})">${p}</button>`).join("");
  document.getElementById("pre-receive").innerHTML=pre.map(p=>`<button class="preset ${p===1?'on':''}" onclick="setQty(${p})">${p}</button>`).join("");
  document.querySelectorAll('#act-give .pick').forEach(b=>b.classList.toggle('sel',b.dataset.t===sh.give.bar));
  document.getElementById("q-give").textContent="1";document.getElementById("q-receive").textContent="1";
  setAct(sh.act);
  document.getElementById("scrim").classList.add("show");
  document.getElementById("sheet").classList.add("show");
}
function refreshMini(){const it=byName(sh.name);document.getElementById("m-store").textContent=fmt(it.store);document.getElementById("m-patio").textContent=fmt(it.patio);document.getElementById("m-back").textContent=fmt(it.back);}
function closeSheet(){document.getElementById("scrim").classList.remove("show");document.getElementById("sheet").classList.remove("show");}
function setAct(a){
  sh.act=a;
  document.querySelectorAll("#actseg button").forEach(b=>b.classList.toggle("on",b.dataset.act===a));
  document.getElementById("act-give").style.display=a==="give"?"block":"none";
  document.getElementById("act-receive").style.display=a==="receive"?"block":"none";
  document.getElementById("act-count").style.display=a==="count"?"block":"none";
  if(a==="count"){const it=byName(sh.name);document.querySelectorAll('#act-count .pick').forEach(b=>b.classList.toggle('sel',b.dataset.t===sh.count.loc));sh.count.val=it[sh.count.loc];document.getElementById("q-count").value=fmt(sh.count.val);onCountInput();}
  document.getElementById("c-give").disabled=a==="give"&&!sh.give.bar;
}
function pickBar(t){sh.give.bar=t;document.querySelectorAll('#act-give .pick').forEach(b=>b.classList.toggle('sel',b.dataset.t===t));document.getElementById("c-give").disabled=false;}
function pickCount(t){sh.count.loc=t;document.querySelectorAll('#act-count .pick').forEach(b=>b.classList.toggle('sel',b.dataset.t===t));const it=byName(sh.name);sh.count.val=it[t];document.getElementById("q-count").value=fmt(it[t]);onCountInput();}
function bump(d){if(sh.act==="count"){const el=document.getElementById("q-count");let v=(parseFloat(el.value)||0)+d;if(v<0)v=0;el.value=fmt(v);onCountInput();return;}const k=sh.act;sh[k].qty=Math.max(1,(sh[k].qty||1)+d);document.getElementById(curQ()).textContent=sh[k].qty;syncPresets();}
function setQty(n){const k=sh.act;sh[k].qty=n;document.getElementById(curQ()).textContent=n;syncPresets();}
function syncPresets(){const box=sh.act==="give"?"#pre-give":"#pre-receive";document.querySelectorAll(box+" .preset").forEach(p=>p.classList.toggle("on",+p.textContent===sh[sh.act].qty));}
function onCountInput(){const it=byName(sh.name);const v=Math.max(0,parseFloat(document.getElementById("q-count").value)||0);sh.count.val=v;const cur=it[sh.count.loc];const d=fmt(v-cur);const ln=LOC[sh.count.loc].replace(' Bar','');document.getElementById("count-note").textContent=d===0?`No change — ${ln} stays at ${fmt(cur)}`:`${ln}: ${fmt(cur)} → ${fmt(v)}  (${d>0?'+':''}${d})`;}

function doGive(){const it=byName(sh.name);if(!it||!sh.give.bar)return;const q2=sh.give.qty;if(q2>it.store){flash(`Only ${fmt(it.store)} in store — receive stock first or fix the store count`);return;}it.store-=q2;it[sh.give.bar]+=q2;const mv={id:mid(),ts:Date.now(),type:"give",item:it.name,cat:it.cat,qty:q2,to:sh.give.bar};moves.unshift(mv);saveInv();saveMoves();closeSheet();render();showToast(`${q2} × ${it.name} → ${LOC[sh.give.bar].replace(' Bar','')}`,mv.id);}
function doReceive(){const it=byName(sh.name);if(!it)return;const q2=sh.receive.qty;it.store+=q2;const mv={id:mid(),ts:Date.now(),type:"receive",item:it.name,cat:it.cat,qty:q2};moves.unshift(mv);saveInv();saveMoves();closeSheet();render();showToast(`+${q2} × ${it.name} received`,mv.id);}
function doCount(){const it=byName(sh.name);if(!it)return;const L=sh.count.loc;const v=Math.max(0,sh.count.val);const prev=it[L];if(v===prev){closeSheet();return;}it[L]=v;const mv={id:mid(),ts:Date.now(),type:"count",item:it.name,cat:it.cat,loc:L,from:prev,to_val:v};moves.unshift(mv);saveInv();saveMoves();closeSheet();render();showToast(`${LOC[L].replace(' Bar','')} count: ${it.name} = ${fmt(v)}`,mv.id);}
function mid(){return Date.now()+"-"+Math.random().toString(36).slice(2,6);}

function showToast(msg,id){undoBuf=id;const t=document.getElementById("toast");document.getElementById("toast-undo").style.display="";document.getElementById("toast-tx").textContent=msg;t.classList.add("show");clearTimeout(undoTimer);undoTimer=setTimeout(()=>{t.classList.remove("show");undoBuf=null;},4500);}
function undoLast(){if(!undoBuf)return;const idx=moves.findIndex(m=>m.id===undoBuf);if(idx<0)return;const mv=moves[idx];const it=byName(mv.item);if(it){if(mv.type==="give"){it.store+=mv.qty;it[mv.to]-=mv.qty;}else if(mv.type==="receive"){it.store-=mv.qty;}else if(mv.type==="count"){it[mv.loc]=mv.from;}}moves.splice(idx,1);saveInv();saveMoves();document.getElementById("toast").classList.remove("show");undoBuf=null;render();}

/* ================= ACTIVITY ================= */
function renderActivity(){
  let h=`<div class="ptitle">Activity <span class="sub">every move, newest first</span></div>`;
  h+=`<div class="toolbar"><button class="tbtn" onclick="copyCSV()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>Copy log (CSV)</button><button class="tbtn" onclick="resetAll()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 3v5h5" stroke-linecap="round" stroke-linejoin="round"/></svg>Reset all</button></div>`;
  if(!moves.length){h+=`<div class="empty">No activity yet.<br>Log your first bottle from the Stock tab.</div>`;document.getElementById("main").innerHTML=h;return;}
  let cur=null;
  moves.forEach(m=>{const dk=dayKey(m.ts);if(dk!==cur){cur=dk;h+=`<div class="day">${dk}</div>`;}
    let icon,title,tag;
    if(m.type==="give"){icon="↗";title=`${m.qty} × ${htmlesc(m.item)}`;tag=`<span class="tag ${m.to}">${LOC[m.to].replace(' Bar','')}</span>`;}
    else if(m.type==="receive"){icon="↓";title=`${m.qty} × ${htmlesc(m.item)}`;tag=`<span class="tag store">Received</span>`;}
    else{icon="✎";title=`${htmlesc(m.item)} → ${fmt(m.to_val)}`;tag=`<span class="tag ${m.loc}">${LOC[m.loc].replace(' Bar','')} count</span>`;}
    const sub=m.type==="count"?`Was ${fmt(m.from)} · ${cap(m.cat)}`:cap(m.cat);
    h+=`<div class="ev ${m.type}"><div class="ic">${icon}</div><div class="m"><div class="t">${title}</div><div class="s">${sub}</div></div>${tag}<div class="time">${timeStr(m.ts)}</div></div>`;});
  document.getElementById("main").innerHTML=h;
}
function copyCSV(){
  const rows=[["Date","Time","Type","Item","Category","Qty/Value","Location"]];
  moves.slice().reverse().forEach(m=>{const d=new Date(m.ts);
    if(m.type==="give")rows.push([d.toLocaleDateString(),timeStr(m.ts),"GIVE OUT",m.item,m.cat,m.qty,LOC[m.to]]);
    else if(m.type==="receive")rows.push([d.toLocaleDateString(),timeStr(m.ts),"RECEIVE",m.item,m.cat,m.qty,"Store"]);
    else rows.push([d.toLocaleDateString(),timeStr(m.ts),"COUNT SET",m.item,m.cat,m.to_val,LOC[m.loc]]);});
  const csv=rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(",")).join("\n");
  const done=()=>flash("Log copied — paste into your sheet");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(csv).then(done).catch(()=>fallbackCopy(csv,done));else fallbackCopy(csv,done);
}
function fallbackCopy(t,cb){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");cb();}catch(e){flash("Couldn't copy automatically");}document.body.removeChild(ta);}
function flash(msg){const t=document.getElementById("toast");document.getElementById("toast-tx").textContent=msg;document.getElementById("toast-undo").style.display="none";t.classList.add("show");setTimeout(()=>{t.classList.remove("show");},2600);}
function resetAll(){if(!confirm("Reset all store and bar counts to the starting numbers and clear the activity log? This can't be undone."))return;inv=SEED.map(x=>({name:x.name,cat:x.cat,store:x.stock,patio:0,back:0,rl:defRL(x.cat)}));moves=[];saveInv();saveMoves();render();}

/* ================= MANAGE ================= */
let mq="";
function renderManage(){
  let h=`<div class="ptitle">Manage <span class="sub">bottles & reorder points</span></div>`;
  h+=`<div class="card addcard"><div class="ch"><h3>Add a bottle</h3></div><div class="frm">
      <div class="fld"><label>Name</label><input id="a-name" placeholder="e.g. Casamigos Mezcal" autocomplete="off"></div>
      <div class="frow">
        <div class="fld"><label>Category</label><select id="a-cat">${CAT_ORDER.map(c=>`<option value="${c}">${cap(c)}</option>`).join("")}</select></div>
        <div class="fld"><label>In store</label><input id="a-store" type="number" inputmode="numeric" value="0"></div>
        <div class="fld"><label>Reorder at</label><input id="a-rl" type="number" inputmode="numeric" value="2"></div>
      </div>
      <button class="btn" onclick="addItem()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>Add bottle</button>
    </div></div>`;
  h+=`<div class="card"><div class="ch"><h3>All bottles</h3><span class="badge">${inv.length}</span></div>
      <div class="search" style="margin-bottom:12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg><input id="mq" placeholder="Search bottles…" value="${htmlesc(mq)}" oninput="onMSearch(this.value)" autocomplete="off"></div>
      <div id="mlist"></div></div>`;
  document.getElementById("main").innerHTML=h;
  renderMList();
}
function onMSearch(v){mq=v;renderMList();}
function renderMList(){
  const el=document.getElementById("mlist"); if(!el)return;
  let items=inv.slice().sort((a,b)=>catRank(a.cat)-catRank(b.cat)||a.name.localeCompare(b.name));
  if(mq.trim())items=items.filter(i=>i.name.toLowerCase().includes(mq.trim().toLowerCase()));
  let h='';
  if(!items.length)h=`<div class="empty" style="padding:20px">No bottles match.</div>`;
  items.forEach(i=>{h+=`<div class="mrow"><div class="mn"><div class="t">${htmlesc(i.name)}</div><div class="s">${cap(i.cat)} · store ${fmt(i.store)} · patio ${fmt(i.patio)} · back ${fmt(i.back)}</div></div>
      <div class="rl"><label>reorder</label><input type="number" inputmode="numeric" value="${fmt(rlOf(i))}" onchange="setRL('${esc(i.name)}',this.value)"></div>
      <button class="del" onclick="delItem('${esc(i.name)}')" aria-label="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`;});
  el.innerHTML=h;
}
function setRL(name,val){const it=byName(name);if(!it)return;it.rl=Math.max(0,parseFloat(val)||0);saveInv();}
function delItem(name){if(!confirm(`Remove "${name}" from the list? Its past activity stays in the log.`))return;const idx=inv.findIndex(i=>i.name===name);if(idx<0)return;inv.splice(idx,1);saveInv();renderMList();document.querySelectorAll(".card .badge").forEach(b=>{if(/^\d+$/.test(b.textContent))b.textContent=inv.length;});flash("Bottle removed");}
function addItem(){
  const name=document.getElementById("a-name").value.trim();
  const cat2=document.getElementById("a-cat").value;
  const store=Math.max(0,parseFloat(document.getElementById("a-store").value)||0);
  const rl=Math.max(0,parseFloat(document.getElementById("a-rl").value)||0);
  if(!name){flash("Give the bottle a name first");document.getElementById("a-name").focus();return;}
  if(byName(name)){flash("That bottle already exists");return;}
  inv.push({name,cat:cat2,store,patio:0,back:0,rl});saveInv();
  document.getElementById("a-name").value="";document.getElementById("a-store").value="0";document.getElementById("a-rl").value="2";
  renderManage();flash(`Added ${name}`);
}

boot();
</script>
